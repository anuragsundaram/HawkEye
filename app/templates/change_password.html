{% extends 'layout.html' %}
{% block content %}
<h2>Change Password</h2>
<form method="POST">
    <div class="form-group">
        {% set _, admins = get_users_dict() %}
        {% if session.get('user_name') not in admins %}
        <label for="old_password">Current Password</label>
        <input type="password" name="old_password" id="old_password" class="form-control">
        {% endif %}
    </div>
    <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" name="new_password" id="new_password" class="form-control" required>
    </div>
    <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
    </div>
    <button type="submit" style="padding: 8px 16px; background-color: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;">Change Password</button>
</form>
{% if show_success %}
    <script>
        document.getElementById('successModal').style.display = 'block';
    </script>
{% endif %}
{% endblock %}
