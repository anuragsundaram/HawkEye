<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel=stylesheet type=text/css href="{{ url_for('static', filename='style.css') }}">
    <title>HawkEye - Database Monitoring - Login</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e40af 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
            min-width: 380px;
            text-align: center;
        }
        
        .login-header {
            margin-bottom: 32px;
        }
        
        .login-logo {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: #1e40af;
            margin: 0;
        }
        
        .login-subtitle {
            font-size: 13px;
            color: #6b7280;
            margin: 4px 0 0 0;
        }
        
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }
        
        .login-form .message-form {
            background: none;
            padding: 0;
            box-shadow: none;
            min-width: auto;
        }
        
        .submit-btn {
            width: 100%;
            padding: 10px !important;
            background: linear-gradient(135deg, #1e40af, #1e3a8a) !important;
            color: white !important;
            border: none !important;
            border-radius: 6px !important;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30, 64, 175, 0.2) !important;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <div class="login-logo">⚙️</div>
        <h1 class="login-title">HawkEye</h1>
        <p class="login-subtitle">Real-time Database Insights</p>
    </div>
    
    <form method="post" class="login-form">
        <div class="form-group">
            <label for="name">Username</label>
            <input type="text" id="name" name="name" maxlength="512" autofocus required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <div>
            {% include 'flashed.html' %}
            <input type="submit" value="Sign In" class="submit-btn">
        </div>
    </form>
</div>
</body>
</html>
